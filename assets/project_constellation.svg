<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Research and product map</title>
  <desc id="desc">Current public work across energy, quantitative research, applied mathematics, scientific computing and technical teaching.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.52" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0b3d46"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="52%" r="48%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#08111f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#panel)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glow)"/>

  <text x="72" y="76" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="850" fill="#ffffff">Research &amp; Product Map</text>
  <text x="72" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" fill="#cbd5e1">Applied mathematics, AI and engineering across energy, quantitative research and scientific computing.</text>

  <g stroke="#7dd3fc" stroke-width="2" opacity="0.35">
    <line x1="640" y1="328" x2="228" y2="206"/>
    <line x1="640" y1="328" x2="520" y2="188"/>
    <line x1="640" y1="328" x2="906" y2="198"/>
    <line x1="640" y1="328" x2="1080" y2="294"/>
    <line x1="640" y1="328" x2="250" y2="478"/>
    <line x1="640" y1="328" x2="530" y2="510"/>
    <line x1="640" y1="328" x2="854" y2="500"/>
  </g>

  <g filter="url(#shadow)">
